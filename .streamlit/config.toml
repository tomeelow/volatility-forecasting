# The dashboard follows the viewer's light / dark preference; charts pick the
# matching palette in app/theme.py.
[theme]
font = "sans serif"

[theme.light]
primaryColor = "#2a78d6"
backgroundColor = "#fcfcfb"
secondaryBackgroundColor = "#f3f2ee"
textColor = "#0b0b0b"

[theme.dark]
primaryColor = "#3987e5"
backgroundColor = "#1a1a19"
secondaryBackgroundColor = "#262624"
textColor = "#f0efec"

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
