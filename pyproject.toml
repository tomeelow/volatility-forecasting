[project]
name = "volcast"
version = "0.1.0"
description = "Walk-forward volatility forecasting on 63 assets: GARCH, HAR-RV and LightGBM, evaluated with QLIKE and Diebold-Mariano tests, plus a volatility-targeting backtest and Streamlit dashboard"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [{ name = "Ivan Tomilo" }]
keywords = [
    "volatility", "forecasting", "garch", "har-rv", "realized-volatility", "lightgbm",
    "walk-forward", "qlike", "diebold-mariano", "volatility-targeting", "quantitative-finance",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "arch>=7.0",
    "joblib>=1.3",
    "lightgbm>=4.3",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pandas>=2.2",
    "plotly>=5.20",
    "pyarrow>=15",
    "scipy>=1.12",
    "streamlit>=1.36",
    "yfinance>=0.2.50",
]

[project.urls]
Demo = "https://tomeelow-volatility-forecasting-appapp-pogiqr.streamlit.app"
Repository = "https://github.com/tomeelow/volatility-forecasting"
Issues = "https://github.com/tomeelow/volatility-forecasting/issues"

[project.scripts]
volcast = "volcast.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/volcast"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
