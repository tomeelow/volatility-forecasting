[project]
name = "volcast"
version = "0.1.0"
description = "Walk-forward volatility forecasting (GARCH, HAR-RV, gradient boosting) on 60+ assets with QLIKE, Diebold-Mariano tests and a volatility-targeting backtest"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
dependencies = [
    "arch>=7.0",
    "joblib>=1.3",
    "lightgbm>=4.3",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pandas>=2.2",
    "plotly>=5.20",
    "pyarrow>=15",
    "scipy>=1.12",
    "streamlit>=1.36",
    "yfinance>=0.2.50",
]

[project.scripts]
volcast = "volcast.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/volcast"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
